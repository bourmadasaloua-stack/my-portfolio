<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and drop shadows -->
  <defs>
    <!-- Main Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    
    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    
    <!-- Neon Indigo Gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App-Icon Rounded Square -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.05)" stroke-width="4"/>

  <!-- Orbital Rings / Tech lines in background -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(6, 182, 212, 0.1)" stroke-width="2" stroke-dasharray="10 15"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(79, 70, 229, 0.15)" stroke-width="3" stroke-dasharray="40 180"/>

  <!-- Styled Futuristic Shield -->
  <path d="M 256 90 
           C 330 90, 390 120, 390 150 
           C 390 260, 340 330, 256 390 
           C 172 330, 122 260, 122 150 
           C 122 120, 182 90, 256 90 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        filter="url(#glow)"
        stroke-linejoin="round"/>
        
  <!-- Inner Shield Glow/Fill -->
  <path d="M 256 105 
           C 320 105, 372 132, 372 158 
           C 372 248, 328 310, 256 364 
           C 184 310, 140 248, 140 158 
           C 140 132, 192 105, 256 105 Z" 
        fill="rgba(8, 145, 178, 0.05)" 
        stroke="rgba(8, 145, 178, 0.2)" 
        stroke-width="2"/>

  <!-- Financial Chart Columns inside the Shield -->
  <!-- Column 1 (Left) -->
  <rect x="200" y="240" width="28" height="80" rx="8" fill="url(#indigoGrad)" />
  <!-- Column 2 (Center) -->
  <rect x="242" y="190" width="28" height="130" rx="8" fill="url(#shieldGrad)" filter="url(#glow)"/>
  <!-- Column 3 (Right) -->
  <rect x="284" y="220" width="28" height="100" rx="8" fill="url(#goldGrad)" />

  <!-- Checkmark / Guarantee Ribbon of Approval -->
  <circle cx="256" cy="335" r="28" fill="#10b981" filter="url(#glow)"/>
  <path d="M 246 335 L 252 341 L 266 327" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Shield Top Crown/Emblem -->
  <path d="M 236 60 L 256 75 L 276 60 L 256 45 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
</svg>
