<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="moodleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f3" />
      <stop offset="100%" stop-color="#fdf0e6" />
    </linearGradient>
    
    <!-- Moodle Orange Gradient -->
    <linearGradient id="moodleOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Graduation Cap Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#moodleBg)" stroke="#f1f5f9" stroke-width="6"/>

  <!-- Moodle stylized "M" -->
  <path d="M 120 400 L 120 220 C 120 180, 160 160, 190 200 L 256 280 L 322 200 C 352 160, 392 180, 392 220 L 392 400" 
        fill="none" stroke="url(#moodleOrange)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  
  <path d="M 120 400 L 120 250" fill="none" stroke="url(#moodleOrange)" stroke-width="48" stroke-linecap="round"/>
  <path d="M 392 400 L 392 250" fill="none" stroke="url(#moodleOrange)" stroke-width="48" stroke-linecap="round"/>

  <!-- Graduation Cap (Mortarboard) on top of the "M" -->
  <!-- Cap Diamond Board -->
  <polygon points="256,80 380,120 256,160 132,120" fill="url(#capGrad)" filter="url(#shadow)"/>
  
  <!-- Skull Cap under the board -->
  <path d="M 190 138 Q 256 165, 322 138" fill="none" stroke="url(#capGrad)" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Tassel -->
  <path d="M 256 120 Q 170 130, 160 200" fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round" filter="url(#shadow)"/>
  <circle cx="160" cy="205" r="10" fill="#f97316"/>
</svg>
