<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="animalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Magical Gold Gradient -->
    <linearGradient id="magicalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Warm Amber Gradient -->
    <linearGradient id="amberWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Emerald Light Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#animalBg)" stroke="rgba(52, 211, 153, 0.2)" stroke-width="4"/>

  <!-- Decorative Magical Stars & Orbs -->
  <circle cx="100" cy="100" r="4" fill="#fef08a" opacity="0.8"/>
  <circle cx="410" cy="120" r="6" fill="#34d399" opacity="0.7"/>
  <circle cx="420" cy="380" r="5" fill="#fef08a" opacity="0.9"/>
  <circle cx="90" cy="390" r="7" fill="#fbbf24" opacity="0.6"/>

  <!-- Open Book Base -->
  <path d="M 120 340 C 180 320, 240 335, 256 345 C 272 335, 332 320, 392 340 L 392 375 C 332 355, 272 370, 256 380 C 240 370, 180 355, 120 375 Z" fill="url(#magicalGold)" opacity="0.9"/>
  <path d="M 125 330 C 180 310, 240 325, 256 335 C 272 325, 332 310, 387 330 L 387 365 C 332 345, 272 360, 256 370 C 240 360, 180 345, 125 365 Z" fill="#ffffff"/>

  <!-- Paw Print with Crown / Magical Lion Motif -->
  <!-- Main Paw Pad -->
  <path d="M 256 240 C 220 240, 210 275, 226 295 C 240 310, 272 310, 286 295 C 302 275, 292 240, 256 240 Z" fill="url(#amberWarm)" filter="url(#glow)"/>
  
  <!-- Toe Pads -->
  <ellipse cx="195" cy="220" rx="18" ry="24" fill="url(#magicalGold)" transform="rotate(-25 195 220)" filter="url(#glow)"/>
  <ellipse cx="235" cy="185" rx="18" ry="26" fill="url(#magicalGold)" transform="rotate(-8 235 185)" filter="url(#glow)"/>
  <ellipse cx="277" cy="185" rx="18" ry="26" fill="url(#magicalGold)" transform="rotate(8 277 185)" filter="url(#glow)"/>
  <ellipse cx="317" cy="220" rx="18" ry="24" fill="url(#magicalGold)" transform="rotate(25 317 220)" filter="url(#glow)"/>

  <!-- Sparkling Magic Wand Light Rays -->
  <path d="M 256 120 L 256 150 M 256 120 L 246 135 M 256 120 L 266 135" stroke="url(#magicalGold)" stroke-width="4" stroke-linecap="round"/>
  <polygon points="256,105 261,117 274,117 263,125 267,137 256,129 245,137 249,125 238,117 251,117" fill="#fef08a" filter="url(#glow)"/>
</svg>
