<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="schoolBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <!-- Primary Purple/Violet Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- White/Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#schoolBg)" stroke="rgba(255,255,255,0.05)" stroke-width="4"/>

  <!-- Orbital Rings in background -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(168, 85, 247, 0.1)" stroke-width="2" stroke-dasharray="8 12"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(251, 191, 36, 0.08)" stroke-width="2" stroke-dasharray="30 150"/>

  <!-- Glowing Sun/Shield behind school -->
  <circle cx="256" cy="210" r="85" fill="rgba(251, 191, 36, 0.06)" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.3" filter="url(#glow)"/>

  <!-- Shield Outline -->
  <path d="M 256 70 
           C 340 70, 400 100, 400 135 
           C 400 260, 340 340, 256 410 
           C 172 340, 112 260, 112 135 
           C 112 100, 172 70, 256 70 Z" 
        fill="none" stroke="url(#purpleGrad)" stroke-width="10" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- School Temple/Building -->
  <!-- Triangle Roof -->
  <polygon points="256,120 330,165 182,165" fill="url(#silverGrad)" filter="url(#glow)"/>
  <!-- Arch/Pediment gold line -->
  <polygon points="256,130 315,160 197,160" fill="url(#goldGrad)"/>
  
  <!-- Columns -->
  <!-- Column 1 (Left) -->
  <rect x="200" y="175" width="20" height="70" rx="3" fill="url(#silverGrad)"/>
  <!-- Column 2 (Center) -->
  <rect x="246" y="175" width="20" height="70" rx="3" fill="url(#silverGrad)"/>
  <!-- Column 3 (Right) -->
  <rect x="292" y="175" width="20" height="70" rx="3" fill="url(#silverGrad)"/>
  
  <!-- Base of Columns -->
  <rect x="180" y="245" width="152" height="15" rx="4" fill="url(#silverGrad)"/>
  
  <!-- Open Book at the bottom -->
  <path d="M 256 315 
           C 285 285, 340 295, 370 305
           L 370 365
           C 340 355, 285 345, 256 370
           C 227 345, 172 355, 142 365
           L 142 305
           C 172 295, 227 285, 256 315 Z" 
        fill="url(#purpleGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
        
  <!-- Book Pages/Details -->
  <path d="M 256 325 C 280 300, 330 310, 355 318 L 355 350 C 330 342, 280 332, 256 355" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  <path d="M 256 325 C 232 300, 182 310, 157 318 L 157 350 C 182 342, 232 332, 256 355" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  
  <!-- Book Spine middle line -->
  <line x1="256" y1="315" x2="256" y2="370" stroke="#ffffff" stroke-width="4"/>

  <!-- Academic Graduation Cap on the roof -->
  <polygon points="256,75 296,90 256,105 216,90" fill="url(#goldGrad)" filter="url(#glow)"/>
  <path d="M 235,96 L 235,108 C 235,115 277,115 277,108 L 277,96" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Tassel -->
  <path d="M 256,90 Q 220,95 218,115" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="218" cy="117" r="4" fill="#ffffff"/>
</svg>
