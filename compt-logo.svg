<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and drop shadows -->
  <defs>
    <!-- Main Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    
    <!-- Balance / Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="lightGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App-Icon Rounded Square -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.05)" stroke-width="4"/>

  <!-- Background Grid Lines representing Ledger -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="rgba(52, 211, 153, 0.1)" stroke-width="2"/>
  <line x1="80" y1="240" x2="432" y2="240" stroke="rgba(52, 211, 153, 0.1)" stroke-width="2"/>
  <line x1="80" y1="320" x2="432" y2="320" stroke="rgba(52, 211, 153, 0.1)" stroke-width="2"/>
  <line x1="80" y1="400" x2="432" y2="400" stroke="rgba(52, 211, 153, 0.1)" stroke-width="2"/>
  <line x1="180" y1="80" x2="180" y2="432" stroke="rgba(52, 211, 153, 0.1)" stroke-width="2"/>
  <line x1="320" y1="80" x2="320" y2="432" stroke="rgba(52, 211, 153, 0.1)" stroke-width="2"/>

  <!-- Balance Scale Base & Stand (Futuristic Neon Style) -->
  <rect x="244" y="140" width="24" height="240" rx="6" fill="url(#emeraldGrad)"/>
  <path d="M 200 380 L 312 380" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Balance Scale Beam (Top Crossbar) -->
  <line x1="130" y1="180" x2="382" y2="180" stroke="url(#lightGreenGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Pivot point -->
  <circle cx="256" cy="180" r="16" fill="#ffffff" filter="url(#glow)"/>

  <!-- Left Scale Pan -->
  <line x1="140" y1="180" x2="140" y2="270" stroke="url(#emeraldGrad)" stroke-width="4"/>
  <path d="M 100 270 C 100 300, 180 300, 180 270 Z" fill="rgba(16, 185, 129, 0.2)" stroke="url(#lightGreenGrad)" stroke-width="4"/>

  <!-- Right Scale Pan (Balanced) -->
  <line x1="372" y1="180" x2="372" y2="270" stroke="url(#emeraldGrad)" stroke-width="4"/>
  <path d="M 332 270 C 332 300, 412 300, 412 270 Z" fill="rgba(16, 185, 129, 0.2)" stroke="url(#lightGreenGrad)" stroke-width="4"/>

  <!-- Financial Chart Growth Arrow weaving through scale -->
  <path d="M 100 340 Q 200 300, 290 220 T 400 130" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Arrow Head -->
  <path d="M 370 130 L 400 130 L 400 160" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
